# NVS Unconditional Scene Generation — Flow Matching on PlatonicAutoencoder latents

seed: 42

autoencoder:
  checkpoint_dir: /home/mghadim/ae_libero_80k_trivial_bias_n256

dataset:
  dataset_name: psplat.data.libero_shards.Dataset
  data_dir: /ivi/zfs/s0/original_homes/mghadim/libero-256-shards
  dataset_fraction: 1.0
  norm_passes: 1                    # 0=disabled, N=fit normaliser over N passes
  normaliser_path: /home/mghadim/PlatonicTransformers/normalisers/latent_normaliser_libero_n256.pt
  repeats_per_epoch: 1
  cache_max_items: 1024
  val_stride: 7
  norm_max_items: 4096

model:
  name: "platoformer"
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  solid_name: "trivial"
  spatial_dim: 3
  dense_mode: true
  scalar_task_level: "node"
  vector_task_level: "node"
  ffn_readout: true
  mean_aggregation: false
  attention: true
  dropout: 0.0
  drop_path_rate: 0.0
  layer_scale_init_value: null
  ffn_dim_factor: 4
  rope_sigma: 4.0
  ape_sigma: null
  learned_freqs: true
  freq_init: "spiral"
  use_key: false
  rope_on_values: true
  compile: true
  attention_backend: "flash"

diffusion:
  sigma_data: 1.0
  P_mean: -1.2
  P_std: 1.2
  avg_num_nodes: 256
  fm_ode_order: 1
  num_steps: 50
  sigma_min: 0.002
  sigma_max: 1.0
  rho: 7.0
  S_churn: 0.0
  sampler: "fm_ode"
  feat_prediction: x             # "edm" = previous behaviour, "x" = x-prediction for the features (positions stay EDM)
  xpred_loss_floor: 0.3           # loss weight on x_hat is edm_weight / max(1-t, floor)^2
  xpred_sample_floor: 0.001       # floor on (1-t) when converting x_hat to a velocity for sampling

training:
  epochs: 500
  limit_train_batches: 128
  batch_size: 16
  gradient_clip_val: 0.5
  train_augm: false
  validation_frequency: 10
  check_val_every_n_epoch: 10
  ema_enabled: true
  ema_decay: 0.999
  ema_warmup_steps: 2000
  copy_ratio_quantile: 0.05        # threshold for copy detection (5th percentile of pairwise train distances)
  feat_loss_weight: 1.0
  pos_loss_weight: 1.0

optimizer:
  name: "adamw"
  lr: 2.0e-4
  weight_decay: 1.0e-4

scheduler:
  name: "cosine"
  use_cosine: true
  T_max_epochs: null

logging:
  enabled: true
  project_name: "Platonic-NVS-FM"
  wandb_identity: mina_ai-university-of-amsterdam
  log_every_n_steps: 50

system:
  gpus: 1
  num_workers: 8
  enable_progress_bar: true
  timer: null
  precision: "32"
  float32_matmul_precision: "high"

testing:
  test_ckpt: null
  resume_ckpt: null
  metrics_out: null

checkpoint:
  monitor: "val/loss"
  mode: "min"
  save_last: true
  snapshot_every_n_epochs: 50     # extra checkpoint every N epochs (0 = off)
